services:
  mongodb:
    restart: always
    hostname: mongodb
    image: mongo:4.4.6
    command: --replSet rs0 --auth
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    volumes:
      - mongodb_data:/data/db
      - ./devenv/docker/mongo/docker-entrypoint-initdb.d/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - unbody
    ports:
      - '127.0.0.1:27017:27017'

  redis:
    restart: always
    hostname: redis
    image: redis:7.2-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - '127.0.0.1:6379:6379'
    networks:
      - unbody

  temporal:
    image: temporalio/admin-tools:1.27.1-tctl-1.18.2-cli-1.3.0
    entrypoint: ['/init.sh']
    ports:
      - '127.0.0.1:7233:7233' # Server
      - '127.0.0.1:8233:8233' # UI
      - '127.0.0.1:60896:60896' # /metrics
    volumes:
      - ./devenv/docker/temporal/init.sh:/init.sh:ro
    networks:
      - unbody

  weaviate:
    build:
      dockerfile: ./devenv/docker/weaviate/Dockerfile
    image: weaviate:unbody
    restart: always
    ports:
      - '127.0.0.1:8080:8080'
      - '127.0.0.1:50051:50051'
    environment:
      - QUERY_DEFAULTS_LIMIT=25
      - AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=${WEAVIATE_ANONYMOUS_ACCESS:-false}
      - AUTHENTICATION_APIKEY_ENABLED=true
      - AUTHENTICATION_APIKEY_ALLOWED_KEYS=${WEAVIATE_API_KEY}
      - AUTHENTICATION_APIKEY_USERS=${WEAVIATE_API_USERS}
      - PERSISTENCE_DATA_PATH=/var/lib/weaviate
      - CLUSTER_HOSTNAME=node1
      - ENABLE_MODULES=text2vec-huggingface,generative-unbody,img2vec-custom,reranker-custom,multi2vec-custom
      - CLUSTER_GOSSIP_BIND_PORT=7100
    volumes:
      - weaviate_data:/var/lib/weaviate
    command: --host 0.0.0.0 --port 8080 --scheme ${WEAVIATE_SCHEME:-http}
    networks:
      - unbody
    extra_hosts:
      # allow weaviate to access services on host
      # via the host.docker.internal hostname
      - 'host.docker.internal:host-gateway'

  img2vec-neural:
    image: semitechnologies/img2vec-pytorch:resnet50
    ports:
      - '127.0.0.1:3456:8080'
    networks:
      - unbody
    environment:
      ENABLE_CUDA: '0'

  file-server:
    image: python:3.9-slim
    ports:
      - '127.0.0.1:5555:5555'
    volumes:
      - ./devenv/docker/file-server/files:/app/files:ro
    command: >
      sh -c "cd /app/files && mkdir -p public private && python -m http.server 5555"
    networks:
      - unbody

volumes:
  mongodb_data:
    driver: local
  weaviate_data:
    driver: local

networks:
  unbody:
    driver: bridge
